<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  * { margin: 0; padding: 0; }
  html, body, #map { width: 100%; height: 100%; }
  .info-window {
    padding: 10px 14px;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    max-width: 260px;
  }
  .info-title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .info-auction .info-title { color: #ea580c; }
  .info-trade .info-title { color: #2563eb; }
  .info-price {
    font-size: 16px;
    font-weight: 800;
    color: #dc2626;
    margin: 4px 0;
  }
  .info-row { color: #64748b; font-size: 12px; }
  .info-badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .badge-auction { background: #fff7ed; color: #9a3412; }
  .badge-trade { background: #eff6ff; color: #1e40af; }
</style>
</head>
<body>
<div id="map"></div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=KAKAO_JS_KEY_PLACEHOLDER&libraries=services&autoload=false"></script>
<script>
var map;
var markers = [];
var infoWindows = [];
var currentInfoWindow = null;
var showOngoing = true;
var showSold = true;
var showUnsold = true;
var allItems = [];

// 지도 초기화
function initMap() {
  var container = document.getElementById('map');
  var options = {
    center: new kakao.maps.LatLng(37.5665, 126.978),
    level: 8
  };
  map = new kakao.maps.Map(container, options);

  // Flutter에 지도 준비 완료 통보
  if (window.FlutterChannel) {
    window.FlutterChannel.postMessage(JSON.stringify({__event: 'map_ready'}));
  }
}

// 디버그 메시지 출력
function debugLog(msg) {
  if (window.FlutterChannel) {
    window.FlutterChannel.postMessage(JSON.stringify({__event: 'debug', msg: msg}));
  }
}

// Flutter에서 호출: 마커 데이터 로드
function loadMarkers(jsonStr) {
  try {
    allItems = JSON.parse(jsonStr);
    debugLog('loadMarkers: ' + allItems.length + '건 수신');
  } catch (e) {
    debugLog('JSON 파싱 실패: ' + e.message);
    return;
  }

  if (!map) {
    debugLog('[오류] map 객체가 아직 없음');
    return;
  }

  renderMarkers();

  // 데이터가 있으면 첫 번째 유효 좌표로 이동
  var valid = allItems.filter(function(i) { return i.lat && i.lat !== 0; });
  debugLog('유효 좌표: ' + valid.length + '건');
  if (valid.length > 0) {
    var first = valid[0];
    map.setCenter(new kakao.maps.LatLng(first.lat, first.lng));
    map.setLevel(5);
  }
}

// 필터 토글 (Flutter에서 호출)
function setFilter(type, visible) {
  if (type === 'ongoing') showOngoing = visible;
  if (type === 'sold') showSold = visible;
  if (type === 'unsold') showUnsold = visible;
  renderMarkers();
}

// 마커 렌더링
function renderMarkers() {
  // 기존 마커 제거
  markers.forEach(function(m) { m.setMap(null); });
  markers = [];
  if (currentInfoWindow) { currentInfoWindow.close(); currentInfoWindow = null; }

  allItems.forEach(function(item) {
    if (!item.lat || item.lat === 0) return;

    // 필터: 경매중/낙찰/유찰
    var status = item['경매상태'] || '';
    if (status === '경매중' && !showOngoing) return;
    if (status === '낙찰' && !showSold) return;
    if (status === '유찰' && !showUnsold) return;

    var position = new kakao.maps.LatLng(item.lat, item.lng);

    // 마커 이미지: 경매중=파랑, 낙찰=초록별, 유찰=주황
    var imageSrc;
    if (status === '낙찰') {
      imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png';
    } else if (status === '유찰') {
      imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/2018/pc/img/marker_spot.png';
    } else {
      imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_blue.png';
    }
    var imageSize = new kakao.maps.Size(24, 35);
    var markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

    var marker = new kakao.maps.Marker({
      position: position,
      image: markerImage,
      map: map
    });

    var content = buildInfoContent(item, true);
    var infoWindow = new kakao.maps.InfoWindow({ content: content });

    kakao.maps.event.addListener(marker, 'click', function() {
      if (currentInfoWindow) currentInfoWindow.close();
      infoWindow.open(map, marker);
      currentInfoWindow = infoWindow;

      // Flutter에 마커 클릭 알림
      if (window.FlutterChannel) {
        FlutterChannel.postMessage(JSON.stringify(item));
      }
    });

    markers.push(marker);
  });
}

function buildInfoContent(item, isAuction) {
  if (isAuction) {
    var aptName = item['아파트명'] || item['사건번호'] || '-';
    var status = item['경매상태'] || item['매각결과'] || '';
    var appraisal = formatWon(item['감정가']);
    var minBid = item['최저입찰가'] ? formatWon(item['최저입찰가']) : '';
    var sale = item['매각금액'] ? formatWon(item['매각금액']) : '';
    var failCount = item['유찰횟수'] || 0;
    var bidRate = item['최저입찰가율'] || 0;

    var statusBadge = '';
    if (status === '낙찰') {
      statusBadge = '<span style="background:#dcfce7;color:#166534;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700;">낙찰</span>';
    } else if (status === '유찰') {
      statusBadge = '<span style="background:#fff7ed;color:#9a3412;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700;">유찰</span>';
    } else if (status === '경매중') {
      statusBadge = '<span style="background:#dbeafe;color:#1e40af;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700;">경매중</span>';
    }

    // 주요 가격: 낙찰=매각금액, 경매중=최저입찰가, 유찰=감정가
    var mainPrice = sale || minBid || appraisal;
    var mainLabel = sale ? '' : (minBid ? '최저입찰가 ' : '감정가 ');

    // 실거래가 요약 (가장 최근 1건만 표시)
    var tradeHtml = '';
    var tradeGroups = item['실거래가목록'] || [];
    if (tradeGroups.length > 0) {
      var latestTrade = null;
      var latestArea = '';
      for (var i = 0; i < tradeGroups.length; i++) {
        var g = tradeGroups[i];
        var trades = g['최근거래'] || [];
        if (trades.length > 0) {
          var t = trades[0]; // 정렬되어 있음
          if (!latestTrade || (t['년'] * 100 + t['월']) > (latestTrade['년'] * 100 + latestTrade['월'])) {
            latestTrade = t;
            latestArea = g['전용면적'] || '';
          }
        }
      }
      if (latestTrade) {
        tradeHtml = '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #cbd5e1;">'
          + '<div style="font-size:11px;color:#1e40af;font-weight:700;">실거래가 ' + latestTrade['년'] + '.' + latestTrade['월'] + (latestArea ? ' (' + latestArea + '㎡)' : '') + '</div>'
          + '<div style="font-size:14px;font-weight:800;color:#1e40af;">' + formatWon10k(latestTrade['거래금액']) + '</div>'
          + '</div>';
      }
    }

    var extraInfo = '';
    if (status === '경매중' && failCount > 0) {
      extraInfo = '<div class="info-row">유찰 ' + failCount + '회 | 입찰가율 ' + bidRate + '%</div>';
    }

    return '<div class="info-window info-auction">'
      + statusBadge
      + '<div class="info-title">' + aptName + '</div>'
      + '<div class="info-row">' + (item['동명'] || item['주소'] || '').substring(0, 40) + '</div>'
      + '<div class="info-price">' + mainLabel + mainPrice + '</div>'
      + '<div class="info-row">감정가 ' + appraisal + '</div>'
      + (status === '경매중'
        ? '<div class="info-row">입찰기일 ' + (item['매각기일'] || '-') + '</div>'
        : '<div class="info-row">매각기일 ' + (item['매각기일'] || '-') + '</div>')
      + extraInfo
      + tradeHtml
      + '</div>';
  } else {
    var aptName = item['아파트명'] || item['aptNm'] || '-';
    var price = item['거래금액(만원)'] || item['dealAmount'] || '-';
    var dong = item['법정동'] || item['umdNm'] || '';
    var area = item['전용면적(㎡)'] || item['excluUseAr'] || '';
    var floor = item['층'] || item['floor'] || '';
    return '<div class="info-window info-trade">'
      + '<span class="info-badge badge-trade">실거래가</span>'
      + '<div class="info-title">' + aptName + '</div>'
      + '<div class="info-price">' + formatPrice(price) + '</div>'
      + '<div class="info-row">' + dong + ' | ' + area + '㎡ | ' + floor + '층</div>'
      + '</div>';
  }
}

function formatPrice(raw) {
  var n = parseInt(String(raw).replace(/,/g, '').trim(), 10);
  if (isNaN(n)) return raw;
  if (n >= 10000) {
    var 억 = Math.floor(n / 10000);
    var 만 = n % 10000;
    return 만 > 0 ? 억 + '억 ' + 만.toLocaleString() + '만원' : 억 + '억원';
  }
  return n.toLocaleString() + '만원';
}

// 만원 단위 → 억/만원 (실거래가 API는 만원 단위)
function formatWon10k(raw) {
  if (!raw && raw !== 0) return '-';
  var n = parseInt(String(raw).replace(/,/g, '').trim(), 10);
  if (isNaN(n) || n === 0) return '-';
  if (n >= 10000) {
    var eok = Math.floor(n / 10000);
    var man = n % 10000;
    return man > 0 ? eok + '억 ' + man.toLocaleString() + '만원' : eok + '억원';
  }
  return n.toLocaleString() + '만원';
}

// 원 단위 → 억/만원 표시
function formatWon(raw) {
  if (!raw && raw !== 0) return '-';
  var n = typeof raw === 'number' ? raw : parseInt(String(raw).replace(/,/g, '').trim(), 10);
  if (isNaN(n) || n === 0) return '-';
  if (n >= 100000000) {
    var 억 = Math.floor(n / 100000000);
    var 만 = Math.floor((n % 100000000) / 10000);
    return 만 > 0 ? 억 + '억 ' + 만.toLocaleString() + '만원' : 억 + '억원';
  } else if (n >= 10000) {
    return (Math.floor(n / 10000)).toLocaleString() + '만원';
  }
  return n.toLocaleString() + '원';
}

// SDK 로딩 완료 후 초기화
kakao.maps.load(function() {
  initMap();
});
</script>
</body>
</html>
